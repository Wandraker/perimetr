name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз с версией из build.gradle.kts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decide release
        id: rel
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$NAME" ]; then
              echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName $NAME"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$WANT" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Restore signing key
        if: steps.rel.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан. Релиз без ключа подписи не собирается."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/perimetr.jks"
          echo "PERIMETR_KEYSTORE=$RUNNER_TEMP/perimetr.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PERIMETR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/perimetr.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: perimetr-apk
          path: perimetr.apk

      - name: Publish release
        if: steps.rel.outputs.release == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          NOTES="android/release-notes/$TAG.md"
          [ -f "$NOTES" ] || echo "Периметр ${TAG#v}" > "$NOTES"
          gh release create "$TAG" perimetr.apk \
            --target "$GITHUB_SHA" \
            --title "Периметр ${TAG#v}" \
            --notes-file "$NOTES" \
            --latest
