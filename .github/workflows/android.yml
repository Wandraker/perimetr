name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Restore signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан. Релиз без ключа подписи не собирается."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/perimetr.jks"
          echo "PERIMETR_KEYSTORE=$RUNNER_TEMP/perimetr.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PERIMETR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName $NAME"
            exit 1
          fi

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/perimetr.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: perimetr-apk
          path: perimetr.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" perimetr.apk \
            --title "Периметр ${GITHUB_REF_NAME#v}" \
            --notes-file "android/release-notes/${GITHUB_REF_NAME}.md" \
            --latest
